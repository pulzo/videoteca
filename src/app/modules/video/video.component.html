<app-header></app-header>

<div class="flex bg-light-light">
    <app-siderbar-light optionMenu="2"></app-siderbar-light>

    <div class="m-auto mt-20 ">
        <p class="text-4xl font-bold">Te damos la bienvenida a la creacion de videos con DAAB</p>

        <video 
            *ngIf="video_url"
            width="100%" 
            controls 
            autoplay 
            muted
        >
            <source [src]="video_url" type="video/mp4">
        </video>


        <form [formGroup]="form">

        <div class="mb-8 w-[30%] mt-6">
            <label class="block text-sm font-bold mb-2">Link de la noticia</label>

            <input type="text" formControlName="link"  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
        </div>

        <div class="mb-8 w-[30%] mt-6">
            <label class="block text-sm font-bold mb-2">Voz</label>

            <select formControlName="voiceId" class="w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all px-4 py-3">
                <option value="" disabled>Selecciona una voz</option>
                <option *ngFor="let voz of voces" [value]="voz.voice_id">
                    {{ voz.name }}
                </option>
            </select>
        </div>

        <div class="mb-8 w-[30%] mt-6">
            <label class="block text-sm font-bold mb-2">Seccion</label>

            <select formControlName="sectionId" class="w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all rounded-md px-4 py-3">
                <option value="" disabled>Selecciona la seccion</option>
                <option *ngFor="let seccion of secciones" [value]="seccion.key">
                    {{ seccion.value }}
                </option>
            </select>
        </div>


        <button  (click)="generarVideo()" 
            class="bg-[#3C00A3] text-white px-6 py-3 rounded-xl mt-6 flex gap-1 w-[22%]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 5V19M5 12H19" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Generar Video
        </button>

        </form>


    </div>

    
    
</div>
